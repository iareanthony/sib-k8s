name: Build Falco Driver Loader

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'falco-driver-loader/**'
      - '.github/workflows/build-falco-driver-loader.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: iareanthony/sib-k8s-falco-driver-loader

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./falco-driver-loader
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:0.44.1-gcc15
          cache-from: type=gha
          cache-to: type=gha,mode=max
