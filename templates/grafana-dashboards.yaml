{{/*
Grafana Dashboards ConfigMap
Loads all Loki-compatible dashboards packaged under dashboards/loki/.
*/}}
{{- if .Values.grafana.dashboardsConfigMaps }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: sib-k8s-dashboards
  labels:
    {{- include "sib-k8s.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
{{- range $path, $_ := .Files.Glob "dashboards/loki/*.json" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
