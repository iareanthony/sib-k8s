# Values for the standalone falcosecurity/falco 9.1.0 release on worker03.
# This is the Secure Boot exception to the main kernel-module DaemonSet.
driver:
  kind: modern_ebpf

nodeSelector:
  kubernetes.io/hostname: k8-worker03

falcosidekick:
  enabled: false

falco:
  json_output: true
  http_output:
    enabled: true
    insecure: true
    url: http://sib-k8s-falcosidekick.security.svc.cluster.local:2801
